name: Build Flutter APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter Environment
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Build Release APK
      - name: Build Flutter APK
        run: flutter build apk --release

      # 6. Upload APK ke GitHub Artifacts (Dapat diunduh kapan saja)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wms-forklift-release
          path: build/app/outputs/flutter-apk/app-release.apk

      # 7. Otomatis Buat Release GitHub (Jika push tag versi, contoh: v1.0.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

